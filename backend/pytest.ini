[pytest]
testpaths = tests
addopts = -q -p no:cacheprovider -m "not e2e and not oracle"
markers =
    e2e: real-browser checks (Playwright + Microsoft Edge); run with  pytest -m e2e
    oracle: requires a real Oracle database (ORACLE_* variables); run with  pytest -m oracle
filterwarnings =
    error::sqlalchemy.exc.SAWarning
    # ldap3 2.9.1 imports two names newer pyasn1 versions call deprecated (harmless; both are pinned)
    ignore:(tagMap|typeMap) is deprecated:DeprecationWarning
