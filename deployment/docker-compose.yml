# Capability Portfolio Command on the offline VM: the app behind nginx (HTTPS). Needs Docker Compose 2.24 or newer.
# Started by scripts/install.sh; everyday commands in scripts/app.sh. APP_VERSION comes from the .env file next to
# this one (written by install.sh); the app's settings come from app.env (and ldap.env for directory sign-in).
name: cpc

services:
  app:
    image: cpc:${APP_VERSION:?APP_VERSION is not set - run scripts/install.sh}
    restart: unless-stopped
    env_file:
      - path: app.env
        required: true
      - path: ldap.env
        required: false
    environment:
      APP_LISTEN: 0.0.0.0:8080
    volumes:
      - ./data:/app/data                 # uploaded document files and scheduled reports: back this folder up
      - ./ldap:/app/ldap:ro              # the company CA certificate for directory sign-in (LDAP_CA_FILE=/app/ldap/...)
    read_only: true
    tmpfs:
      - /tmp:size=256m                   # large uploads are buffered here while they arrive
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["8080"]                     # reachable from nginx only; not published on the VM
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "10"}

  proxy:
    image: nginx:1.27.3-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "10"}
