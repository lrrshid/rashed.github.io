# The HTTPS front of Capability Portfolio Command (mounted read-only into the proxy container).
# Port 80 only redirects; port 443 serves TLS with IT's certificate (certs/server.crt + certs/server.key) and passes
# everything to the app. The app sets its own security headers (CSP, HSTS, ...); nginx does not add or change them.
worker_processes auto;
pid /var/run/nginx.pid;
error_log stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;                       # the app writes its own JSON access log (docker compose logs app)
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    upstream cpc_app { server app:8080; keepalive 16; }

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;   # the certificate followed by the intermediate chain (PEM)
        ssl_certificate_key /etc/nginx/certs/server.key;   # PEM, no password
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Document uploads are up to 20 MB (document_service.MAX_BYTES) plus the form around them.
        client_max_body_size 21m;

        location / {
            proxy_pass http://cpc_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # SET, never appended: the app trusts exactly one proxy (TRUSTED_PROXY_COUNT=1), so a browser cannot
            # forge its address or the scheme by sending these headers itself.
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Request-ID      $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;    # large Excel / PowerPoint exports and reports
        }
    }
}
